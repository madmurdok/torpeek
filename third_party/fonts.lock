# Where the embedded typeface comes from.
#
# One stanza per woff2 file in internal/web/assets/fonts, which is the project's
# first binary asset in git (TOR-120). The repository had avoided one until now
# on purpose - TOR-101 went out of its way to render its CI fixtures on the
# runner rather than commit an image - so this file is the argument for the
# exception, and the record that makes it checkable: every file's sha256, the
# exact URL it was fetched from, and the unicode-range the CSS declares for it.
#
# WHY EMBED AT ALL. torpeek's promise is a folder that needs no network beyond
# the torrent, and the UI also runs headless on a seedbox behind somebody's
# reverse proxy. A face linked from fonts.googleapis.com fails there silently
# and differently on every machine, so the design would be a suggestion rather
# than a fact. 140532 bytes (137.2 KB) buys it outright, against the
# ~110 MiB of ffmpeg the archives already carry - four thousandths of the
# download.
#
# THE LICENCE IS WHY THE FAMILY IS RENAMED, and this is the part that is easy to
# get wrong. IBM Plex is SIL OFL 1.1, which permits bundling; but its copyright
# line reads `with Reserved Font Name "Plex"`, and OFL clause 3 forbids a
# Modified Version from using a Reserved Font Name as the primary name presented
# to users. A subset is a Modified Version - it deletes glyphs - and every file
# here is a subset. So the CSS presents these as "Torpeek Sans" and "Torpeek
# Mono". IBM's copyright notice and the full licence text travel in
# packaging/licenses/fonts/OFL.txt and into every archive; see docs/licensing.md.
#
# WHY THE TWO FAMILIES ARE FETCHED DIFFERENTLY. Google serves IBM Plex Sans as a
# variable font covering 400-700 in one file per subset, and IBM Plex Mono only
# as static instances. So the CSS the UI actually needs - 400 for body, 500 for
# names, 700 for headings in the sans; 400 and 600 in the mono - costs
# 89.4 KB for the sans as one axis against 159.0 KB for the same four
# weights as statics, while the mono pays per weight either way. That is the one
# place a variable font is the smaller answer rather than the fashionable one,
# and it is why the mono was cut from the four weights the CSS asked for to two:
# the only 700 uses were the submit button and the state badges, both small,
# uppercase and letter-spaced, where 600 and 700 differ by a hair.
#
# TO REFETCH: the URLs below are Google Fonts asset URLs and are stable per
# revision, not forever. If one 404s, request the same family and weight from
# fonts.googleapis.com/css2 with a modern browser User-Agent (without one it
# answers with a different, non-woff2 form) and take the URL for the same
# subset. Verify the sha256 before committing a replacement: a different hash
# means a different cut of the font, which is a design change, not a refresh.

total_bytes = 140532
total_files = 9
