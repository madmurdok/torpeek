# Where the bundled ffmpeg and ffprobe come from.
#
# One stanza per release platform, keyed by the same name `make cross` uses for
# its output directory. This file is the provenance record for TOR-26: it names
# the upstream build, the exact FFmpeg commit inside it, and the sha256 of both
# the archive and of each binary extracted from it. scripts/fetch-ffmpeg.sh
# verifies every one of those hashes before anything is packaged, so a silent
# substitution upstream fails the fetch instead of shipping.
#
# `license` is not decoration, and it is not the same on every platform. Linux
# and Windows carry an LGPL build; macOS carries a GPL one, because no LGPL
# macOS build worth shipping exists and torpeek's own source is MIT, which may
# travel inside a GPL-licensed whole (TOR-93). The consequence is that the
# macOS archive as a whole is distributed under the GPL while the other two are
# not, so every generated notice reads `license` and `license_file` rather than
# assuming one answer. See docs/licensing.md for the decision and what it
# obliges.
#
# Two independent guards keep a stanza's `license` honest, because an upstream
# asset repointed at a differently configured build is the one failure that
# would otherwise ship quietly:
#
#   license_member / license_sha256
#       the licence text the upstream archive itself carries. BtbN ships one
#       next to the binaries; martin-riedl's zips hold the executable and
#       nothing else, so both keys are `none` there and the guard below is the
#       whole check.
#   configure_requires / configure_forbids
#       flags that must, and must not, appear in the FFmpeg configure line the
#       binaries embed and print for `-version`. This reads the artefact we
#       actually ship rather than a text file beside it, and it works for a
#       target this machine cannot execute. Measured: `--enable-gpl` is present
#       in the macOS builds and absent from BtbN's -lgpl ones, so the check
#       does tell the two apart. `--enable-nonfree` is forbidden everywhere -
#       a nonfree build may not be redistributed by anyone, at all.
#
# `url` is the archive holding ffmpeg. When ffprobe lives in a second archive -
# martin-riedl publishes one zip per executable - `ffprobe_url` and
# `ffprobe_archive_sha256` name it; otherwise both are absent and ffprobe comes
# out of the same archive. `archive_root` is the directory every member sits
# under inside the archive, or `.` when they sit at its top level.
#
# status = ok       this platform has a bundled ffmpeg and can be packaged
# status = blocked  no build we would ship exists yet; `reason` says why
#
# Keys are read by a plain awk parser: `key = value`, one per line, no quoting,
# no continuations.

