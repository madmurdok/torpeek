# Where the bundled ffmpeg and ffprobe come from.
#
# One stanza per release platform, keyed by the same name `make cross` uses for
# its output directory. This file is the provenance record for TOR-26: it names
# the upstream build, the exact FFmpeg commit inside it, and the sha256 of both
# the archive and of each binary extracted from it. scripts/fetch-ffmpeg.sh
# verifies every one of those hashes before anything is packaged, so a silent
# substitution upstream fails the fetch instead of shipping.
#
# `license` is not decoration. torpeek distributes these binaries inside its
# own release archive, so only an LGPL build may appear here - a GPL build
# would extend the GPL over the distributed whole. See docs/licensing.md for
# the decision and what it obliges. `license_sha256` pins the licence text the
# upstream archive itself carries: if BtbN ever repointed an -lgpl asset at a
# GPL build, that text would change and the fetch would refuse.
#
# status = ok       this platform has a bundled ffmpeg and can be packaged
# status = blocked  no LGPL build we would ship exists yet; `reason` says why
#
# Keys are read by a plain awk parser: `key = value`, one per line, no quoting,
# no continuations.

[linux-amd64]
status         = ok
source         = BtbN/FFmpeg-Builds
release_tag    = autobuild-2026-08-31-13-27
build_scripts  = https://github.com/BtbN/FFmpeg-Builds/tree/8267213e26c1031621e6e1210fe3aa4867214f6a
variant        = lgpl, static (no external shared libraries beyond glibc)
license        = LGPL-3.0-or-later
ffmpeg_version = n9.0.1-11-ge47273f4d9
ffmpeg_commit  = e47273f4d9227152dcbf543cebaf9e2430ddbcc4
ffmpeg_source  = https://github.com/FFmpeg/FFmpeg/archive/e47273f4d9227152dcbf543cebaf9e2430ddbcc4.tar.gz
url            = https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n9.0.1-11-ge47273f4d9-linux64-lgpl-9.0.tar.xz
archive_sha256 = 204fc02692b11249c3e688ad18538ce2939129a1fc6abc32a6b2638a024496cf
archive_root   = ffmpeg-n9.0.1-11-ge47273f4d9-linux64-lgpl-9.0
