# macOS is the one platform whose bundled ffmpeg is GPL rather than LGPL, and
# that is a decision, not an oversight. There is no prebuilt LGPL macOS build
# worth shipping - docs/licensing.md's macOS gap section records everything
# that was checked and why each was rejected - and since TOR-92 made torpeek
# MIT there is nothing left for a GPL build to constrain. The macOS archive
# therefore travels under the GPL as a whole while the Linux and Windows ones
# do not: deliberately, rather than downgrading those recipients' rights for
# the sake of one uniform sentence.
#
# The two arches are separate builds from the same FFmpeg 9.0.1 release, made
# two hours apart and with different clang builds, so they share
# `ffmpeg_commit` and nothing else. Each `release_tag` is the builder's own
# immutable directory id: the /redirect/latest/... URLs the site advertises for
# scripts move, and a lock that pinned one would pin nothing.
#
# The builder applies no patches to FFmpeg - its build-ffmpeg.sh unpacks the
# release tarball and runs ./configure - so the corresponding source is FFmpeg
# 9.0.1 unmodified, plus the `build_scripts` commit each stanza names.
#
# The `x264_*` keys exist because that last sentence has one hole (TOR-98).
# Following the build definition gets you the exact source of every library in
# these binaries except one: its `version/` directory holds 36 pinned versions
# and x264 is not one of them - `script/build-x264.sh` fetches
# code.videolan.org/videolan/x264/-/archive/master/x264-master.tar.gz - a
# moving ref. So the revision the shipped binary contains is recorded here and
# nowhere upstream, and the macOS written offer names it from these keys:
#
#   x264_commit / x264_source / x264_source_sha256 / x264_tree_sha256
#       the revision the binary was built from, where its source is, and two
#       hashes of it. The tarball hash is the file's own bytes; the tree hash
#       is over its contents, so a re-compressed archive can be told apart
#       from a different tree. That revision was `master`'s tip from
#       2025-09-16 - eleven months before these builds - until today, which is
#       how it was identified: docs/licensing.md records the evidence, what it
#       proves and what it does not.
#   x264_build / x264_marker
#       x264 build 165, and the version string encoder/set.c compiles into
#       anything linked against it. Grepping the binaries for that string is
#       what stops x264_commit from outliving the binary it describes: x264
#       stamps no revision into a build made from a tarball (upstream's own
#       versions.txt says `0.165.x`), so nothing else here would notice.
#
# All six keys or none. The LGPL platforms have none, because those builds
# contain no x264 at all.

