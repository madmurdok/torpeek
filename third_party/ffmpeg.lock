# macOS has no prebuilt LGPL ffmpeg from a source worth trusting. Every static
# macOS build on offer is --enable-gpl (evermeet.cx adds --enable-nonfree on
# top; ffmpeg.martin-riedl.de, OSXExperts and the npm/PyPI repackagers of them
# are all GPL), and the one genuinely LGPL macOS build - conda-forge's
# ffmpeg-*-lgpl_* - is dynamically linked against a 69-library, 139 MB closure
# rather than being two self-contained files. Filling these two stanzas in is a
# decision for a person, not for the packaging script: see docs/licensing.md,
# "The macOS gap". Until then `make archives` builds what it can and exits
# non-zero naming what it could not, so a three-of-four release cannot pass for
# a whole one.

[darwin-amd64]
status = blocked
reason = no prebuilt LGPL ffmpeg/ffprobe for macOS; see docs/licensing.md

[darwin-arm64]
status = blocked
reason = no prebuilt LGPL ffmpeg/ffprobe for macOS; see docs/licensing.md
