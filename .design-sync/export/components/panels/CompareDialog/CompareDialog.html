<!-- @dsCard group="Panels" name="CompareDialog" subtitle="Two encodes of one film, on one rectangle, one keypress apart" -->
<!doctype html>
<meta charset="utf-8">
<title>CompareDialog</title>
<!-- The design system's own entry sheet, so this card is drawn by the same
     rules a rendered design gets: compare.css draws this component, and
     intake.css carries the bare `select, button` rules the two set pickers and
     the four bar controls inherit. framepanel.css lends it one class -
     .lightbox-close, which the close cross reuses. -->
<link rel="stylesheet" href="../../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); }
</style>

<!-- STATIC ON PURPOSE, AND THE FIRST LESSON OF THIS EXPORT APPLIES HERE
     LITERALLY: a preview card renders WITHOUT scripts, and a <dialog> without
     `open` is `display: none` in every UA stylesheet. The frame panel's first
     card called open() and rendered nothing but the body's background. So the
     dialog below carries `open`, and with it every value the element would
     have computed for this comparison:

       - --compare-aspect ON THE STAGE, from aspectOf(data.a): a BARE NUMBER,
         not "w / h", because compare.css also multiplies it inside a calc()
         to bound the stage's height without breaking its shape. It is set
         ONCE per comparison and never per position - a stage that re-shaped
         itself as the pictures arrived would move the picture, which is the
         one thing this component must not do.
       - BOTH ARMS' src AT ONCE. Not decoration: a flip is a visibility toggle
         over pixels the browser has already decoded, never a fetch, so both
         arms are given a src for every position whichever one is live.
       - data-live="a" on the stage, which is what makes arm A visible and arm
         B `visibility: hidden` - never display:none, which would let the
         browser drop the hidden arm's decoded pixels.
       - data-gap="false", the ordinary case: the live arm has a frame here.
       - The pickers' own OPTIONS, built by fillPickers() from GET
         /compare/sets, and labelled by setLabel() - which puts the params key
         in full and LAST, because two sets of the same file of the same
         torrent differ in nothing a person can see except their frame counts,
         and two runs at the same count do not differ in that either.
       - The place, the two arm times with the live one wearing the accent, and
         the note saying what the pairing left out.

     THE TWO ARMS ARE TWO REAL ENCODES OF ONE FRAME, deliberately: arm A is the
     source picture and arm B is the same frame at a much lower quality. That
     is what this component is FOR, and it is the only way a still picture of a
     flipbook can show it - flip to arm B in a running design and the
     difference is what you are looking for. -->
<dialog id="compare" class="compare" open>
  <button id="compare-close" class="lightbox-close" type="button" aria-label="Close">&times;</button>
  <header class="compare-head">
    <!-- WHICH ARM IS LIVE is the only thing a flip changes, and it is marked
         with the accent - not with a border, and not with a semantic colour.
         Nothing has gone wrong when you flip, so --bad or --warn would be a
         lie; and a border here would be a marking drawn ON the picture's edge,
         changing under the eye at the very moment the eye is trying to hold an
         afterimage. -->
    <label class="compare-arm" data-arm="a" data-live="true">
      <span class="compare-key" aria-hidden="true">1</span>
      <select id="compare-a" class="compare-pick" aria-label="The first set to compare">
        <option value="5a8062c07b3e6a1d0c9f4b2e8a1d7c3f5e9b0a24:c1f4a2e97b3d:1" selected>Sintel (2010) 1080p · sintel-1080p.mkv · 8 frames · 14:48 · c1f4a2e97b3d</option>
        <option value="5a8062c07b3e6a1d0c9f4b2e8a1d7c3f5e9b0a24:9b0a24d5e8f1:2">Sintel (2010) 720p · sintel-720p.mkv · 6 of 8 frames · 14:48 · 9b0a24d5e8f1</option>
      </select>
    </label>
    <label class="compare-arm" data-arm="b" data-live="false">
      <span class="compare-key" aria-hidden="true">2</span>
      <select id="compare-b" class="compare-pick" aria-label="The second set to compare">
        <option value="5a8062c07b3e6a1d0c9f4b2e8a1d7c3f5e9b0a24:c1f4a2e97b3d:1">Sintel (2010) 1080p · sintel-1080p.mkv · 8 frames · 14:48 · c1f4a2e97b3d</option>
        <option value="5a8062c07b3e6a1d0c9f4b2e8a1d7c3f5e9b0a24:9b0a24d5e8f1:2" selected>Sintel (2010) 720p · sintel-720p.mkv · 6 of 8 frames · 14:48 · 9b0a24d5e8f1</option>
      </select>
    </label>
  </header>
