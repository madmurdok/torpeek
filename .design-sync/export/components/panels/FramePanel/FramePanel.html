<!-- @dsCard group="Panels" name="FramePanel" subtitle="One frame, at fit or 100%, with a pan that cannot leak" -->
<!doctype html>
<meta charset="utf-8">
<title>FramePanel</title>
<!-- The design system's own entry sheet, so this card is drawn by the same
     rules a rendered design gets: tokens, the two faces, and the panel's own
     stylesheet, in index.html's load order. -->
<link rel="stylesheet" href="../../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); }
</style>

<!-- STATIC ON PURPOSE, AND THE FIRST VERSION OF THIS CARD WAS NOT.
     It loaded the bundle and called panel.open(), which rendered correctly in
     a plain browser and rendered NOTHING here: the card's preview does not run
     scripts, and a <dialog> without `open` is display:none in every UA
     stylesheet - so all that showed was the body painted #03070B.
     A card is a PICTURE of the component, not the component running. So the
     markup below carries `open` and the exact values frame-panel.js's layout()
     would have written for this picture: a 640x360 frame FITS, so fit = 1, the
     box equals the picture's own size, the zoom gesture is not offered
     (data-zoom="none") and the readout reads 100%.
     That is rule 1 shown rather than described - the panel shrinks to meet the
     picture instead of upscaling it. -->
<dialog id="lightbox" class="lightbox" open data-zoom="none">
  <p class="lightbox-bar">
    <span class="lightbox-tab">
      <span class="lightbox-chev" aria-hidden="true">&rsaquo;&rsaquo;</span>
      frame
      <!-- The zoom readout, and the one thing in this panel wearing --accent:
           it is the state, not decoration. aria-live so a change announces
           itself to anyone who cannot see the pill fill. -->
      <span id="lightbox-zoom" class="lightbox-zoom" aria-live="polite">100%</span>
    </span>
    <span class="lightbox-ticks" aria-hidden="true"></span>
  </p>
  <div id="lightbox-view" class="lightbox-view"
       style="--lb-view-w: 640px; --lb-view-h: 360px" tabindex="0" role="button"
       aria-label="The frame - press to zoom to 100%, then the arrow keys pan it">
